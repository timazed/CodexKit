name: Restore compatible build intermediates
description: Restore a compatible incremental build baseline; always rebuild changed sources and rerun verification.
inputs:
  kind:
    description: Separate SDK, iOS, minimum iOS, and macOS caches
    required: true
  paths:
    description: Build paths; never authentication or user application data
    required: true
runs:
  using: composite
  steps:
    - id: identity
      shell: bash
      env:
        CACHE_KIND: ${{ inputs.kind }}
        DEPENDENCIES: ${{ hashFiles('Package.swift', 'Package.resolved', 'DemoApp/**/Package.resolved') }}
      run: |
        set -euo pipefail
        fingerprint=$( { sw_vers; uname -m; xcodebuild -version; swift --version; } | shasum -a 256 | cut -d ' ' -f 1)
        echo "prefix=build-v1-${CACHE_KIND}-${fingerprint}-${DEPENDENCIES}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ inputs.paths }}
        # One baseline per dependency/toolchain identity avoids gigabytes of duplicate
        # per-commit snapshots. SwiftPM/Xcode still invalidate changed inputs normally.
        key: ${{ steps.identity.outputs.prefix }}
        # Also accepts the initial per-source keys during migration.
        restore-keys: ${{ steps.identity.outputs.prefix }}-
