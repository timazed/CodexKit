name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended:
        description: Force fresh verification, full demos, and extended stress workloads
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.ref != 'refs/heads/main' }}

jobs:
  plan:
    name: Verification plan
    # Codex PRs wait for canonical branch proof; other PRs check the merge revision.
    # A new main merge SHA needs its own proof before release.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verify: ${{ steps.plan.outputs.verify }}
      stress: ${{ steps.plan.outputs.stress }}
      full_demos: ${{ steps.plan.outputs.full_demos }}
      evidence_url: ${{ steps.plan.outputs.evidence_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source size and verification harness tests
        run: |
          python3 Scripts/check_source_size.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Tests/Verification
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_plan.py

  sdk:
    name: SDK (${{ matrix.profile }})
    needs: plan
    if: needs.plan.outputs.verify == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: current
            runner: macos-latest
          - profile: minimum
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    # Ten minutes is a performance target; unfinished verification never becomes a pass.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/minimum-swift
        if: matrix.profile == 'minimum'
      - uses: ./.github/actions/build-cache
        with:
          kind: sdk-${{ matrix.profile }}
          paths: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
            .build/build.db
            .build/debug.yaml
            .build/release.yaml
            .build/arm64-apple-macosx
            .build/x86_64-apple-macosx
      - name: Full SDK tests
        run: |
          set -euo pipefail
          python3 Scripts/ci_timed.py --name 'SDK debug build and tests' --output "$RUNNER_TEMP/timing-debug.json" -- \
            swift test --force-resolved-versions -Xswiftc -warnings-as-errors 2>&1 | tee "$RUNNER_TEMP/package-tests.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/timing-*.json
            ${{ runner.temp }}/*tests.log
          retention-days: 14

  optimized:
    name: SDK (optimized)
    needs: plan
    if: needs.plan.outputs.verify == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cache
        with:
          kind: sdk-optimized
          paths: |
            .build/artifacts
            .build/checkouts
            .build/repositories
            .build/workspace-state.json
            .build/build.db
            .build/debug.yaml
            .build/release.yaml
            .build/arm64-apple-macosx
            .build/x86_64-apple-macosx
      - name: Optimized correctness checks (all four library targets)
        env:
          CODEXKIT_STRESS_ROUNDS: ${{ needs.plan.outputs.stress == 'true' && '40' || '6' }}
        run: |
          set -euo pipefail
          python3 Scripts/ci_timed.py --name 'SDK optimized build and tests' --output "$RUNNER_TEMP/timing-optimized.json" -- \
            swift test -c release --force-resolved-versions -Xswiftc -warnings-as-errors \
            --filter 'RuntimePerformanceTests|SDKDesignTests|StorageQueueCancellationTests|StorageLockCancellationTests|RuntimeConcurrencyStressTests|StructuredRecoveryTests|ResponseRecoveryInvestigationTests' \
            2>&1 | tee "$RUNNER_TEMP/optimized-tests.log"
      - name: Extended image and storage benchmarks (reuse the built test bundle)
        if: needs.plan.outputs.stress == 'true'
        env:
          CODEXKIT_RUN_PERFORMANCE_TESTS: "1"
        run: |
          set -euo pipefail
          python3 Scripts/ci_timed.py --name 'Extended benchmarks' --output "$RUNNER_TEMP/timing-benchmarks.json" -- \
            swift test -c release --skip-build --force-resolved-versions \
            --filter 'RealisticPerformanceTests|RuntimeSystemBenchmarkTests' \
            2>&1 | tee "$RUNNER_TEMP/benchmarks.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-optimized
          path: |
            ${{ runner.temp }}/timing-*.json
            ${{ runner.temp }}/optimized-tests.log
            ${{ runner.temp }}/benchmarks.log
          retention-days: 14

  demos:
    name: Demo (${{ matrix.platform }})
    needs: plan
    if: needs.plan.outputs.verify == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cache
        with:
          kind: demo-${{ matrix.platform }}
          paths: |
            .build/simulator-verification/Build
            .build/simulator-verification/SourcePackages
            .build/simulator-verification/ModuleCache.noindex
            .build/macos-demo/Build
            .build/macos-demo/SourcePackages
            .build/macos-demo/ModuleCache.noindex
      - name: Build and verify the signed demo
        env:
          PLATFORM: ${{ matrix.platform }}
          FULL_DEMOS: ${{ needs.plan.outputs.full_demos }}
        run: |
          set -euo pipefail
          mode=smoke
          if [[ "$FULL_DEMOS" == true ]]; then mode=full; fi
          if [[ "$PLATFORM" == iOS ]]; then
            python3 Scripts/verify_ios_simulator.py --mode "$mode" --output-dir "$RUNNER_TEMP/demo-verification"
          else
            python3 Scripts/verify_macos_demo.py --mode "$mode"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/demo-verification
            .build/macos-demo/build.log
            .build/macos-demo/*result.json
            .build/macos-demo/timings.json
          retention-days: 14

  build-minimum-simulator:
    name: Build iOS 17 verifier
    needs: plan
    if: needs.plan.outputs.verify == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-cache
        with:
          kind: demo-iOS17-universal
          paths: |
            .build/minimum-simulator/Build
            .build/minimum-simulator/SourcePackages
            .build/minimum-simulator/ModuleCache.noindex
      - name: Build portable signed simulator app
        run: |
          set -euo pipefail
          python3 Scripts/verify_ios_simulator.py --build-only \
            --output-dir "$RUNNER_TEMP/minimum-simulator-build" --derived-data .build/minimum-simulator
          products=.build/minimum-simulator/Build/Products/Debug-iphonesimulator
          lipo "$products/CodexKitIOSDemo.app/CodexKitIOSDemo" -verify_arch arm64 x86_64
          tar -czf "$RUNNER_TEMP/minimum-simulator-app.tar.gz" -C "$products" CodexKitIOSDemo.app
      - uses: actions/upload-artifact@v7
        with:
          name: minimum-simulator-app
          path: ${{ runner.temp }}/minimum-simulator-app.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: minimum-simulator-build
          path: ${{ runner.temp }}/minimum-simulator-build
          retention-days: 14

  minimum-simulator:
    name: Demo (iOS 17)
    needs: [plan, build-minimum-simulator]
    if: needs.plan.outputs.verify == 'true'
    runs-on: macos-14
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: minimum-simulator-app
          path: ${{ runner.temp }}/minimum-simulator-download
      - name: Verify the prebuilt app on iOS 17
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/minimum-simulator-download"
          tar -xzf "$archive/minimum-simulator-app.tar.gz" -C "$archive"
          python3 Scripts/verify_ios_simulator.py --runtime 17.0.1 --mode smoke \
            --app "$archive/CodexKitIOSDemo.app" --output-dir "$RUNNER_TEMP/minimum-simulator-verification"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: minimum-simulator-verification
          path: ${{ runner.temp }}/minimum-simulator-verification
          retention-days: 14

  verified:
    name: Verification gate v1
    needs: [plan, sdk, optimized, demos, build-minimum-simulator, minimum-simulator]
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require complete verification or original exact-commit evidence
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          assert needs['plan']['result'] == 'success', 'Verification planning failed'
          plan = needs['plan']['outputs']
          if plan['verify'] == 'false':
              assert plan['evidence_url'], 'Missing original verification evidence'
              print('Reused complete verification:', plan['evidence_url'])
          else:
              for job in ('sdk', 'optimized', 'demos', 'build-minimum-simulator', 'minimum-simulator'):
                  assert needs[job]['result'] == 'success', f'{job} did not pass'
              print('All required checks passed for this commit')
          PYTHON
