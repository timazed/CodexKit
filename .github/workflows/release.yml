name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Verified tag to publish, for example v2.0.0-alpha.31
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      # Gate code comes from main, never from an arbitrary historical tag.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require successful CI for the exact tagged commit
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/release_gate.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure the tag still identifies the verified commit
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$VERIFIED_SHA"
      - uses: actions/download-artifact@v8
        with:
          name: verified-release-notes
          path: ${{ runner.temp }}/release-notes
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag_name || github.ref_name, '-') }}
